experiment_name: 05_resnet50_finetune
seed: 42
output_dir: outputs
data:
  root: data/raw/real_vs_fake/real-vs-fake
  image_size: 224
  batch_size: 32
  num_workers: 4
  train_subset: null
  val_subset: null
  test_subset: null
augment:
  standard: true
  degradation: false
  degradation_prob: 0.5
model:
  name: resnet50
  pretrained: true
  dropout: 0.2
train:
  epochs: 5
  lr: 0.0003
  backbone_lr_mult: 0.1
  weight_decay: 0.0001
  warmup_epochs: 1
  freeze_backbone_epochs: 0
  early_stopping_patience: 2
