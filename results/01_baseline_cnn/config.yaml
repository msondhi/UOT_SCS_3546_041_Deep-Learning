experiment_name: 01_baseline_cnn
seed: 42
output_dir: outputs
data:
  root: data/raw/real_vs_fake/real-vs-fake
  image_size: 224
  batch_size: 64
  num_workers: 4
  train_subset: null
  val_subset: null
  test_subset: null
augment:
  standard: true
  degradation: false
  degradation_prob: 0.5
model:
  name: simple_cnn
  pretrained: false
  dropout: 0.2
train:
  epochs: 10
  lr: 0.001
  backbone_lr_mult: 1.0
  weight_decay: 0.0001
  warmup_epochs: 1
  freeze_backbone_epochs: 0
  early_stopping_patience: 3
